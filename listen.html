<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listen — Space Your Face</title>
<link rel="canonical" href="https://spaceyourface.band/listen.html" />
<link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@700&display=swap" rel="stylesheet" />
<style>
  :root {
    --silver: #c0c0c0;
    --nebula-move-duration: 60s;
    --nebula-hue-duration: 20s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #000 url("starfield.JPG") center center / cover no-repeat;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255, 0, 150, 0.18), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.15), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(255, 255, 0, 0.12), transparent 65%),
      radial-gradient(circle at 30% 80%, rgba(0, 255, 0, 0.15), transparent 55%);
    animation: nebulaMove var(--nebula-move-duration) ease-in-out infinite alternate,
      hueShift var(--nebula-hue-duration) linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  .player-shell {
    position: relative;
    z-index: 1;
    width: min(760px, 100%);
    background: rgba(8, 8, 8, 0.72);
    border: 1px solid rgba(192, 192, 192, 0.28);
    border-radius: 18px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    overflow: hidden;
    color: var(--silver);
  }

  .player-shell-inner {
    display: grid;
    grid-template-columns: minmax(190px, 270px) minmax(0, 1fr);
    min-height: 520px;
  }

  .player-blade {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(0, 0, 0, 0.45);
    border-right: 1px solid rgba(192, 192, 192, 0.18);
  }

  .playlist-header {
    flex: 0 0 auto;
    padding: 16px 14px 12px;
    text-align: center;
    border-bottom: 1px solid rgba(192, 192, 192, 0.18);
  }

  .playlist-album-title {
    font-family: "Inknut Antiqua", serif;
    font-weight: 700;
    font-size: 1.55rem;
    line-height: 1.1;
    color: var(--silver);
    text-shadow: 2px 2px 3px #000, 0 0 10px #444;
  }

  .playlist-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
  }

  .playlist {
    list-style: none;
    padding: 8px 0 12px;
  }

  .playlist-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 0.92rem;
    line-height: 1.3;
  }

  .playlist-item:hover { background: rgba(192, 192, 192, 0.08); }

  .playlist-item.is-active {
    background: rgba(192, 192, 192, 0.14);
    border-left-color: var(--silver);
  }

  .playlist-item:focus-visible {
    outline: 1px solid rgba(192, 192, 192, 0.7);
    outline-offset: -2px;
  }

  .playlist-item-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .playlist-item-duration {
    flex: 0 0 auto;
    opacity: 0.72;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
  }

  .player-main {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    padding: 22px 24px 18px;
    background:
      linear-gradient(165deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.62)),
      url("starfield.JPG") center / cover no-repeat;
  }

  .player-stack,
  .download-row {
    position: relative;
    z-index: 1;
  }

  .player-stack {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    min-height: 0;
  }

  .player-main-focus {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .player-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(68%, 280px);
    height: auto;
    z-index: 0;
    pointer-events: none;
    filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.75));
    transition: opacity 0.45s ease;
  }

  .player-main:not(.player-main--idle) .player-mark {
    opacity: 0.28;
  }

  .player-chrome {
    width: 100%;
  }

  .now-playing { text-align: center; width: 100%; }

  .track-title {
    font-family: "Inknut Antiqua", serif;
    font-size: clamp(1.25rem, 2.4vw, 1.7rem);
    font-weight: 700;
    line-height: 1.25;
    color: var(--silver);
    text-shadow: 2px 2px 4px #000, 0 0 12px #444;
  }

  audio {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
  }

  .transport {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .progress-container {
    height: 6px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.22);
    cursor: pointer;
  }

  .progress-container:focus-visible {
    outline: 2px solid rgba(192, 192, 192, 0.7);
    outline-offset: 3px;
  }

  .progress {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: var(--silver);
    box-shadow: 0 0 10px rgba(192, 192, 192, 0.45);
  }

  .duration-wrapper {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
  }

  .player-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .ctrl-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--silver);
    cursor: pointer;
    border-radius: 10px;
    padding: 6px 12px;
  }

  .ctrl-btn:hover { background: rgba(255, 255, 255, 0.08); }

  .ctrl-btn:focus-visible {
    outline: 2px solid rgba(192, 192, 192, 0.7);
    outline-offset: 2px;
  }

  .ctrl-btn svg {
    display: block;
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.8));
  }

  .ctrl-main svg { width: 30px; height: 30px; }

  .download-row {
    display: flex;
    justify-content: center;
    margin-top: 8px;
  }

  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid rgba(192, 192, 192, 0.4);
    background: rgba(192, 192, 192, 0.1);
    color: var(--silver);
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
  }

  .download-link:hover,
  .download-link:focus-visible {
    background: rgba(192, 192, 192, 0.2);
    color: #fff;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 520px) {
    body {
      align-items: stretch;
      padding: 12px 10px;
    }

    .player-shell { max-height: calc(100dvh - 24px); display: flex; }

    .player-shell-inner {
      flex: 1 1 auto;
      min-height: 0;
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(168px, 30vh) minmax(0, 1fr);
    }

    .player-blade {
      display: contents;
    }

    .playlist-header { grid-row: 1; border-right: none; background: rgba(0, 0, 0, 0.45); }
    .player-main { grid-row: 2; border-top: 1px solid rgba(192, 192, 192, 0.12); padding: 14px 14px 10px; }
    .playlist-body {
      grid-row: 3;
      border-top: 1px solid rgba(192, 192, 192, 0.18);
      background: rgba(0, 0, 0, 0.45);
    }

    .player-mark { width: min(46%, 160px); }
    .track-title { font-size: 1.2rem; }
  }

  @keyframes nebulaMove {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-25%, -25%) scale(1.15); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes hueShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="player-shell" id="player-shell">
    <div class="player-shell-inner">
      <aside class="player-blade" aria-label="First Jam track list">
        <div class="playlist-header">
          <div class="playlist-album-title">First Jam</div>
        </div>
        <div class="playlist-body" id="playlist-panel">
          <ul class="playlist" id="playlist" role="listbox" aria-label="Tracks"></ul>
        </div>
      </aside>

      <div class="player-main player-main--idle" id="player-main">
        <img class="player-mark" id="player-mark" src="SYF.png" alt="" />
        <div class="player-stack">
          <div class="player-main-focus">
            <div class="player-chrome" id="player-chrome" hidden>
              <div class="now-playing">
                <h2 class="track-title" id="title"></h2>
              </div>
              <audio id="audio" preload="metadata" playsinline></audio>
            </div>
          </div>

          <div class="transport" id="player-transport" hidden>
            <div class="progress-container" id="progress-container" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
              <div class="progress" id="progress"></div>
            </div>
            <div class="duration-wrapper">
              <span id="current-time">0:00</span>
              <span id="duration">0:00</span>
            </div>
            <div class="player-controls">
              <button type="button" class="ctrl-btn" id="prev" aria-label="Previous track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
              </button>
              <button type="button" class="ctrl-btn ctrl-main" id="play" aria-label="Play">
                <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon-path" fill="currentColor" d="M8 5v14l11-7z"/></svg>
              </button>
              <button type="button" class="ctrl-btn" id="next" aria-label="Next track">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zm10 0V6h2v12h-2z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="download-row" id="player-download-row" hidden>
          <a class="download-link" id="download-mp3" href="#" download>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2z"/></svg>
            Download MP3
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tracks = [
      { title: "Truckin'", file: "01-truckin.mp3" },
      { title: "They Love Each Other", file: "02-they-love-each-other.mp3" },
      { title: "Bird Song", file: "03-bird-song.mp3" },
      { title: "Eyes > Other One", file: "04-eyes-other-one.mp3" },
      { title: "Jack Straw", file: "05-jack-straw.mp3" },
      { title: "Franklin's Tower", file: "06-franklins-tower.mp3" },
      { title: "Brown-Eyed Women", file: "07-brown-eyed-women.mp3" },
      { title: "Deal", file: "08-deal.mp3" },
      { title: "Scarlet > Fire", file: "09-scarlet-fire.mp3" },
    ];

    const titleEl = document.getElementById("title");
    const music = document.getElementById("audio");
    const progressContainer = document.getElementById("progress-container");
    const progress = document.getElementById("progress");
    const currentTimeEle = document.getElementById("current-time");
    const durationEle = document.getElementById("duration");
    const prevBtn = document.getElementById("prev");
    const playBtn = document.getElementById("play");
    const nextBtn = document.getElementById("next");
    const playIconPath = document.getElementById("play-icon-path");
    const PLAY_ICON = "M8 5v14l11-7z";
    const PAUSE_ICON = "M6 5h4v14H6zm8 0h4v14h-4z";
    const downloadLink = document.getElementById("download-mp3");
    const playlistEl = document.getElementById("playlist");
    const playerMainEl = document.getElementById("player-main");
    const playerChromeEl = document.getElementById("player-chrome");
    const playerTransportEl = document.getElementById("player-transport");
    const playerDownloadRowEl = document.getElementById("player-download-row");

    let songIndex = -1;
    let isPlaying = false;
    const durationCache = new Map();

    function trackSrc(track) {
      return "music/" + track.file;
    }

    function formatTime(seconds) {
      if (!seconds || !isFinite(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function setPlayingUi(playing) {
      isPlaying = playing;
      playIconPath.setAttribute("d", playing ? PAUSE_ICON : PLAY_ICON);
      playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
    }

    function showChrome() {
      playerMainEl.classList.remove("player-main--idle");
      playerChromeEl.hidden = false;
      playerTransportEl.hidden = false;
      playerDownloadRowEl.hidden = false;
    }

    function setActive(index) {
      playlistEl.querySelectorAll(".playlist-item").forEach((li, i) => {
        const on = i === index;
        li.classList.toggle("is-active", on);
        li.setAttribute("aria-selected", on ? "true" : "false");
      });
    }

    function loadTrack(index, autoplay) {
      const track = tracks[index];
      if (!track) return;
      songIndex = index;
      titleEl.textContent = track.title;
      const src = trackSrc(track);
      music.src = src;
      downloadLink.href = src;
      downloadLink.setAttribute("download", track.title + ".mp3");
      showChrome();
      setActive(index);
      if (autoplay) playSong();
    }

    function playSong() {
      if (songIndex < 0) {
        loadTrack(0, true);
        return;
      }
      const pending = music.play();
      if (pending) {
        pending.catch(() => {
          if (!music.paused) return;
          setPlayingUi(false);
        });
      }
    }

    function pauseSong() {
      music.pause();
    }

    function step(delta) {
      if (songIndex < 0) {
        loadTrack(0, true);
        return;
      }
      let next = songIndex + delta;
      if (next < 0) next = tracks.length - 1;
      if (next >= tracks.length) next = 0;
      loadTrack(next, true);
    }

    function updateProgressBar() {
      const duration = music.duration;
      const current = music.currentTime || 0;
      currentTimeEle.textContent = formatTime(current);
      if (!duration || !isFinite(duration)) {
        progress.style.width = "0%";
        durationEle.textContent = "0:00";
        progressContainer.setAttribute("aria-valuenow", "0");
        return;
      }
      const pct = (current / duration) * 100;
      progress.style.width = pct + "%";
      durationEle.textContent = formatTime(duration);
      progressContainer.setAttribute("aria-valuenow", String(Math.round(pct)));
      progressContainer.setAttribute("aria-valuetext", formatTime(current) + " of " + formatTime(duration));
    }

    function seekFromClientX(clientX) {
      const duration = music.duration;
      if (!duration || !isFinite(duration)) return;
      const rect = progressContainer.getBoundingClientRect();
      if (!rect.width) return;
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      music.currentTime = ratio * duration;
    }

    function renderPlaylist() {
      playlistEl.textContent = "";
      tracks.forEach((track, i) => {
        const li = document.createElement("li");
        li.className = "playlist-item";
        li.setAttribute("role", "option");
        li.tabIndex = 0;
        li.setAttribute("aria-selected", "false");
        const name = document.createElement("span");
        name.className = "playlist-item-name";
        name.textContent = track.title;
        const duration = document.createElement("span");
        duration.className = "playlist-item-duration";
        const cached = durationCache.get(track.file);
        duration.textContent = cached ? formatTime(cached) : "";
        li.append(name, duration);
        const choose = () => loadTrack(i, true);
        li.addEventListener("click", choose);
        li.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            choose();
          }
        });
        playlistEl.append(li);
      });
    }

    function probeDuration(track) {
      const probe = new Audio();
      probe.preload = "metadata";
      probe.src = trackSrc(track);
      const apply = () => {
        const d = probe.duration;
        if (!d || !isFinite(d)) return;
        durationCache.set(track.file, d);
        const row = playlistEl.children[tracks.indexOf(track)];
        const el = row && row.querySelector(".playlist-item-duration");
        if (el) el.textContent = formatTime(d);
        probe.removeAttribute("src");
        probe.load();
      };
      probe.addEventListener("loadedmetadata", apply, { once: true });
    }

    playBtn.addEventListener("click", () => (isPlaying ? pauseSong() : playSong()));
    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));
    music.addEventListener("play", () => setPlayingUi(true));
    music.addEventListener("pause", () => setPlayingUi(false));
    music.addEventListener("timeupdate", updateProgressBar);
    music.addEventListener("loadedmetadata", () => {
      const track = tracks[songIndex];
      if (track && isFinite(music.duration)) {
        durationCache.set(track.file, music.duration);
        const row = playlistEl.children[songIndex];
        const el = row && row.querySelector(".playlist-item-duration");
        if (el) el.textContent = formatTime(music.duration);
      }
      updateProgressBar();
    });
    music.addEventListener("ended", () => step(1));
    music.addEventListener("error", () => {
      if (songIndex < 0) return;
      setPlayingUi(false);
    });
    progressContainer.addEventListener("click", (e) => seekFromClientX(e.clientX));
    progressContainer.addEventListener("keydown", (e) => {
      const d = music.duration;
      if (!d || !isFinite(d)) return;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") {
        e.preventDefault();
        music.currentTime = Math.min(d, music.currentTime + 5);
      } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
        e.preventDefault();
        music.currentTime = Math.max(0, music.currentTime - 5);
      }
    });

    renderPlaylist();
    tracks.forEach(probeDuration);
  </script>
</body>
</html>
