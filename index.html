<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Your Face</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --fade-duration-logo: 2s;
    --fade-duration-tagline: 3s; /* tagline fades slower */
    --nebula-move-duration: 60s;
    --nebula-hue-duration: 20s;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: black url("starfield.JPG") repeat center center / cover;
    color: white;
    font-family: Arial, sans-serif;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
    padding:
      max(20px, env(safe-area-inset-top))
      20px
      max(20px, env(safe-area-inset-bottom));
  }

  /* Nebula overlay - consistent look */
  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background: radial-gradient(
        circle at 20% 30%,
        rgba(255, 0, 150, 0.18),
        transparent 55%
      ),
      radial-gradient(
        circle at 80% 70%,
        rgba(0, 255, 255, 0.15),
        transparent 55%
      ),
      radial-gradient(
        circle at 50% 50%,
        rgba(255, 255, 0, 0.12),
        transparent 65%
      ),
      radial-gradient(
        circle at 30% 80%,
        rgba(0, 255, 0, 0.15),
        transparent 55%
      );
    background-size: cover;
    animation: nebulaMove var(--nebula-move-duration) ease-in-out infinite
        alternate,
      hueShift var(--nebula-hue-duration) linear infinite;
    z-index: 0;
    pointer-events: none;
  }

  /* Content wrapper */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(88vw, 480px);
    height: 100%;
    min-height: 0;
  }

  .logo {
    flex: 0 1 auto;
    min-height: 0;
    width: auto;
    max-width: 100%;
    height: auto;
    max-height: min(58dvh, 520px);
    object-fit: contain;
    animation: fadeInLogo var(--fade-duration-logo) ease forwards;
  }

  .tagline {
    width: 100%;
    text-align: center;
    font-family: "Inknut Antiqua", serif;
    font-weight: 700;
    color: #c0c0c0;
    text-shadow: 2px 2px 4px #000, 0 0 10px #666;
    animation: fadeInTagline var(--fade-duration-tagline) ease forwards;
    margin-top: clamp(14px, 2.4vh, 24px);
    font-size: clamp(1.15rem, 2.7vw, 1.85rem);
    line-height: 1.45;
  }

  /* Logo fade */
  @keyframes fadeInLogo {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Tagline fade - slower and more gradual */
  @keyframes fadeInTagline {
    0% { opacity: 0; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  @keyframes nebulaMove {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-25%, -25%) scale(1.15); }
    100% { transform: translate(0, 0) scale(1); }
  }

  @keyframes hueShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="content">
    <img class="logo" src="SYF.png" alt="Space Your Face Logo" />
    <div class="tagline">(Heavy Jams)<br>from Asheville, NC</div>
  </div>
</body>
</html>
